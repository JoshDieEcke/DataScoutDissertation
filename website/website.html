<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Scout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            width: 90%;
            max-width: 1200px;
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #6a0dad;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 15px 20px 15px;
        }

        .navbar .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }

        .navbar .nav-links {
            display: flex;
            gap: 20px;
        }

        .navbar .nav-links a {
            padding: 10px 20px;
            text-decoration: none;
            color: #fff;
            background-color: #4b0082;
            border-radius: 10px;
            font-weight: bold;
        }

        .navbar .nav-links a.active {
            background-color: #6a0dad;
        }

        .navbar .search-bar {
            background-color: #6a0dad;
            padding: 5px;
            border-radius: 10px;
        }

        .navbar .search-bar input {
            padding: 5px 10px;
            border: none;
            outline: none;
            border-radius: 5px;
        }

        /* Main Content */
        .main-content {
            display: flex;
            gap: 20px;
            justify-content: space-around;
        }

        .card {
            background-color: #9b59b6;
            border-radius: 20px;
            width: 30%;
            padding: 20px;
            text-align: center;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .dropdown {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: #6a0dad;
            border-radius: 10px;
            padding: 10px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .player-list {
            list-style: none;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .player-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .player-name,
        .player-score {
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            border-radius: 10px;
        }

        .close {
            float: right;
            cursor: pointer;
        }

        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-buttons button {
            padding: 8px 16px;
            background-color: #4b0082;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .auth-buttons span {
            color: white;
            margin-right: 10px;
        }

        #autocomplete-dropdown {
            display: none;
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            margin-top: 2px;
        }

        #autocomplete-dropdown div {
            padding: 10px 15px;
            cursor: pointer;
            color: #333;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        #autocomplete-dropdown div:last-child {
            border-bottom: none;
        }

        #autocomplete-dropdown div:hover {
            background-color: #f0f0f0;
            color: #6a0dad;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navbar -->
        <div class="navbar">
            <a href="/" class="logo">Data Scout</a>
            <div class="nav-links">
                <a href="/displayData">Database</a>
                <a href="teamBuilder">Team Builder</a>
                <a href="compare">Comparison</a>
                <a href="account" class="active">Account</a>
            </div>
            <div class="search-bar">
                <form id="search-form">
                    <input type="text" id="player_name" name="player_name" placeholder="Enter player name" autocomplete="off">
                    <div id="autocomplete-dropdown"></div>
                    <button type="submit">Search</button>
                </form>
            </div>
            <div class="auth-buttons">
                <button id="loginButton">Login/Register</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div id="authModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Login/Register</h2>
                    <form id="loginForm">
                        <input type="text" id="loginUsername" placeholder="Username" required>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <button type="submit">Login</button>
                    </form>
                    <form id="registerForm">
                        <input type="text" id="registerUsername" placeholder="Username" required>
                        <input type="password" id="registerPassword" placeholder="Password" required>
                        <button type="submit">Register</button>
                    </form>
                </div>
            </div>
            <div class="card">
                <h2>Defenders</h2>
                <div class="dropdown">
                    <label for="position">Role:</label>
                    <select id="position">
                        <option value="Ball Playing Defender">Ball Playing Defender</option>
                        <option value="Central Defender">Sweeper</option>
                        <option value="No-Nonsense Centre-Back">Stopper</option>
                        <option value="Full-Back">Full-Back</option>
                        <option value="Wing-Back">Wing-Back</option>
                    </select>
                </div>
                <ul class="player-list"></ul>
            </div>
            <div class="card">
                <h2>Midfielders</h2>
                <div class="dropdown">
                    <label for="position">Role:</label>
                    <select id="position">
                        <option value="Deep Lying Playmaker">Deep Lying Playmaker</option>
                        <option value="Defensive Midfielder">Holding Midfielder</option>
                        <option value="Ball Winning Midfielder">Ball Winning Midfielder</option>
                        <option value="Box-To-Box Midfielder">Box-To-Box Midfielder</option>
                        <option value="Advanced Playmaker">Advanced Playmaker</option>
                        <option value="Wide Midfielder">Wide Midfielder</option>
                    </select>
                </div>
                <ul class="player-list"></ul>
            </div>
            <div class="card">
                <h2>Attackers</h2>
                <div class="dropdown">
                    <label for="position">Role:</label>
                    <select id="position">
                        <option value="Winger">Winger</option>
                        <option value="Poacher">Poacher</option>
                        <option value="Advanced Forward">Mobile Striker</option>
                        <option value="Deep Lying Forward">Shadow Striker</option>
                        <option value="Target Forward">Target Man</option>
                        <option value="False Nine">False Nine</option>
                    </select>
                </div>
                <ul class="player-list"></ul>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='homepage.js') }}"></script>
</body>
</html>
